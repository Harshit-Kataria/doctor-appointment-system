<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareDesk | Appointments & Patients</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✚</span><span>CareDesk<small>Practice workspace</small></span></div>
      <nav aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard">◫ <span>Overview</span></button>
        <button class="nav-item" data-view="appointments">▦ <span>Appointments</span></button>
        <button class="nav-item" data-view="patients">♙ <span>Patients</span></button>
        <button class="nav-item" data-view="doctors">♧ <span>Doctors</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="help-card"><strong>Simple practice management</strong><p>Your records are saved to your private account.</p></div><span class="sidebar-caption">CareDesk · Version 1.0</span></div>
    </aside>
    <div class="main-area">
      <header class="topbar"><button id="menu-toggle" class="icon-button menu-toggle" aria-label="Toggle menu">☰</button><div class="breadcrumb">Practice <span>/</span> <strong id="breadcrumb-current">Overview</strong></div><div class="today-label" id="today-label"></div><button class="action-btn" id="logout-button" data-action="logout">Sign out</button></header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
